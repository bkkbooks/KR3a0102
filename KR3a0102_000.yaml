front:
  text: 聖諭廣訓序
  hash: sha256:024fb3b227b47d7d88b4279a7f283282cc6823fad536b29a7aaac99663ff0f70
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3a0102_WYG_000-1a, image: WYG0717/WYG0717-0589a.png}
body:
  text: 書曰毎嵗孟春遒人以木鐸徇於路記曰司徒脩六禮以節民性明七教以興民德此皆以敦本崇實之道為牖民覺世之模法莫良焉意莫厚焉我聖祖仁皇帝久道化成德洋恩普仁育萬物義正萬民六十年來宵衣旰食祗期薄海内外興仁講讓革薄從忠共成親遜之風永享昇平之治故特頒上諭十六條曉諭八旗及直省兵民人等自綱常名教之際以至於畊桑作息之間本末精粗公私鉅細凡民情之所習皆睿慮之所周視爾編氓誠如赤子聖有謨訓明徵定保萬世守之莫能易也朕纘承大統臨御兆人以聖祖之心為心以聖祖之政為政夙夜黽勉率由舊章惟恐小民遵信奉行久而或怠用申誥誡以示提撕謹將上諭十六條尋繹其義推衍其文共得萬言名曰聖諭廣訓旁徵逺引往復周詳意取顯明語多直樸無非奉先志以啟後人使羣黎百姓家喻而户曉也願爾兵民等仰體聖祖正德厚生之至意勿視為條教號令之虚文共勉為謹身節用之庶人盡除夫浮薄囂淩之陋習則風俗醇厚家室和平在朝廷德化樂觀其成爾後嗣子孫並受其福積善之家必有餘慶其理豈或爽哉雍正二年二月初二日欽定四庫全書子部一聖諭廣訓十六條儒家類敦孝弟以重人倫篤宗族以昭雍睦和鄉黨以息爭訟重農桑以足衣食尚節儉以惜財用隆學校以端士習黜異端以崇正學講法律以儆愚頑明禮讓以厚風俗務本業以定民志訓子弟以禁非為息誣告以全善良誡匿逃以免株連完錢糧以省催科聨保甲以弭盜賊解讐忿以重身命臣等謹案聖諭廣訓一卷聖諭十六條聖祖仁皇帝所頒廣訓一萬餘言則我世宗憲皇帝推繹聖謨以垂範奕世者也粤稽虞代命契為司徒敬敷五教當時必有誥誡之文今佚不可考周禮州長正月之吉各屬其州之民而讀法以考其徳行道蓺而勸之糾其過惡而戒之又族師月吉則屬民而讀教法書其孝弟睦婣有學者其法今亦不𫝊然而聖帝明王膺作君作師之任其啓廸愚必反覆丁寧申以文告則其制章章可考故書稱皇極之敷言是彛是訓于帝其訓也惟是厯代以來如家訓世範之類率儒者私教于一家琴堂諭俗編之類亦守令自行于一邑罕聞九重揮翰為愚夫愚婦特撰一編獨明太祖所著資治通訓諸書具載永樂大典中而義或不醇詞或不雅世亦無述焉洪惟我聖祖仁皇帝體天牖下民之意親揮宸翰示億兆以典型我世宗憲皇帝復欽承覺世之㫖鄭重申明俾家弦户誦聖有謨訓詞約義宏括為十有六語不為少演為一萬餘言不為多迄今朔望宣讀士民肅聼人人易知易從而皓首不能罄其藴誠所謂言而世為天下則矣乾隆四十四年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
